<!-- Home page. Shows tournaments that user can search through and join-->

<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv='cache-control' content='no-cache'>
        <title>Home</title>
        <link rel="stylesheet" href="stylesheets/style.css">
    </head>

    <body>
        <div class="navbar">
            <h2 id="site-title">Tournament Manager</h1>
            
            <form id="filter-form">
                <div><input id="search" type="text" name="search" placeholder="Search tournaments..."></div>

                <div>
                    <select name="game">
                        <option value="">All games</option>
                    </select>
                    <select name="skill_level">
                        <option value="">All skill levels</option>
                    </select>
                    <select name="sort">
                        <option value="start">Starting soonest</option>
                        <option value="newest">Newest added</option>
                    </select>
                </div>

                <div>
                    <label><input type="checkbox" name="open">Registration Available</label>
                    <label><input type="checkbox" name="has_spots">Not Full</label>
                    <label><input type="checkbox" name="past">Already Started</label>
                </div>

                <div>
                    <button type="submit">Apply</button>
                    <button type="button" id="filter-clear">Clear</button>
                </div>
            </form>

            <div id="user-buttons">
                <div id="not-logged">
                    <button id="login" onclick="location.href='login.html'">Login</button>
                    <button id="signup" onclick="location.href='signup.html'">Signup</button>
                </div>
                <div id="is-logged">
                    <button id="create" onclick="location.href='create.html'">Create</button>
                    <button id="my-tournaments" onclick="location.href='my-tournaments.html'">My Tournaments</button>
                    <button id="logout">Log Out</button>
                </div>
            </div>
        </div>

        <div id="tournament-list" class="centered"></div>
        <div id="page-select" class="centered">
            <button id="page-back">&lt;</button>
            <span id="page-counter">Page 1</span>
            <button id="page-next">&gt;</button>
        </div>
    </body>

    <script src="scripts/common.js"></script>
    <script src="scripts/registration.js"></script>
    <script src="scripts/homepage.js"></script>
    <script src="scripts/script.js"></script>
    <script src="scripts/buttons.js"></script>
</html>
