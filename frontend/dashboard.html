<!-- User handles actual tournament information -->

<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv='cache-control' content='no-cache'>
        <title>Dashboard</title>
        <link rel="stylesheet" href="stylesheets/style.css">
    </head>

    <body>
        <div id="user-buttons">
            <button id="back">&larr; Back to tournaments</button>
            <button id="edit">Edit Tournament</button>
            <!-- Delete Tournament -->
        </div>
        <h1 id="tournament-title">Loading...</h1>
        <div id="tournament-matches"></div>
        <div id="action-buttons">
            <button>Declare Round Winner</button>
            <button>Swap Participants</button>
            <button>Remove Participant</button>
        </div>
        <div id="user-lists">
            <div>
                <h2>Registered</h2>
                <ul id="registered"></ul>
            </div>
            <div>
                <h2>Waitlist</h2>
                <ul id="waitlist"></ul>
            </div>
        </div>
    </body>

    <script src="scripts/common.js"></script>
    <script src="scripts/dashboard.js"></script>
</html>
