<!-- User handles actual tournament information -->

<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv='cache-control' content='no-cache'>
        <title>Dashboard</title>
        <link rel="stylesheet" href="stylesheets/style.css">
    </head>

    <body>
        <div id="disallowed" hidden>
            <h1>Unable to load tournament.</h1>
            <h2>This tournament may not exist or you do not have permission to view it.</h2>
            <button onclick="location.href='/'">Home</button>
        </div>
        <div id="allowed">
            <div id="user-buttons">
                <button id="back">&larr; Back</button>
                <button id="edit">Edit Tournament</button>
            </div>
            <h1 id="tournament-title">Loading...</h1>
            <h3 id="start-time">Tournament Starts: </h2>
            <div id="tournament-matches"></div>
            <div id="action-buttons">
                <button id="winner">Declare Round Winner</button>
                <button id="swap">Swap Participants</button>
                <button id="remove">Remove Participant</button>
            </div>
            <div id="user-lists">
                <div>
                    <h2>Registered</h2>
                    <ul id="registered"></ul>
                </div>
                <div>
                    <h2>Waitlist</h2>
                    <ul id="waitlist"></ul>
                </div>
            </div>
        </div>
    </body>

    <script src="scripts/common.js"></script>
    <script src="scripts/dashboard.js"></script>
</html>
