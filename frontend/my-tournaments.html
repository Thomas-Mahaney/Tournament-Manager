<!-- Lets user view owned/joined tournaments -->

<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv='cache-control' content='no-cache'>
        <title>My Tournaments</title>
        <link rel="stylesheet" href="stylesheets/style.css">
    </head>

    <body>
        <div class="navbar">
            <h2 id="site-title">Tournament Manager</h1>

            <form id="filter-form">
                <div><input type="text" name="search" placeholder="Search tournaments..."></div>
                
                <div>
                    <select name="game">
                        <option value="">All games</option>
                    </select>
                    <select name="skill_level">
                        <option value="">All skill levels</option>
                    </select>
                    <select name="sort">
                        <option value="start">Starting soonest</option>
                        <option value="newest">Newest added</option>
                    </select>
                </div>

                <div>
                    <label><input type="checkbox" name="open"> Open for registration</label>
                    <label><input type="checkbox" name="has_spots"> Has open spots</label>
                </div>
                
                <div>
                    <button type="submit">Apply</button>
                    <button type="button" id="filter-clear">Clear</button>
                </div>
            </form>

            <div id="user-buttons">
                <button onclick="location.href='/'">Home</button>
                <button id="owned-button" disabled>Owned</button>
                <button id="joined-button">Joined</button>
            </div>
        </div>
        <div id="tournament-list" class="centered"></div>
        <div id="page-select" class="centered">
            <button id="page-back">&lt;</button>
            <span id="page-counter">Page 1</span>
            <button id="page-next">&gt;</button>
        </div>
    </body>

    <script src="scripts/common.js"></script>
    <script src="scripts/registration.js"></script>
    <script src="scripts/my-lists.js"></script>
    <script src="scripts/script.js"></script>
</html>
